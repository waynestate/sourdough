name: CI

on:
  push:
    branches: ['**']
    tags: ['v*', '*.*.*']

permissions:
  contents: read

jobs:
  ci:
    uses: waynestate/preflight/.github/workflows/php-package.yml@30dd7094089931015ec8754fb321e17659749f05 # 0.6.0
    with:
      php-versions: '["8.3","8.4","8.5"]'
      ci-command: composer ci

  # Smoke gate: bake each shape for real and run the generated app's own
  # checks (see MAINTAINING.md, "Smoke gate"). A shape may only be claimed
  # when its gate is green. Blocking, like the GitLab smoke jobs: every shape
  # baked green here on two runs, so a red loaf now fails the workflow.
  smoke:
    strategy:
      fail-fast: false
      matrix:
        shape: [raw, raw-vue, blade, blade-vue, inertia]
    runs-on: ubuntu-latest
    steps:
      - name: Check out the recipe
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Smoke the ${{ matrix.shape }} shape
        run: |
          docker build -q -f scripts/smoke.Dockerfile -t sourdough-smoke:local .
          docker run --rm -v "$GITHUB_WORKSPACE:/repo:ro" -v /work -e SMOKE_WORK=/work sourdough-smoke:local sh /repo/scripts/smoke-shape.sh ${{ matrix.shape }}
