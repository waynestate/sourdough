# Sourdough's pipeline, built from the Preflight components on this GitLab.
# Every include is pinned to one Preflight release, 0.5.0. Never use ~latest.
# composer ci is the contract: the same checks run on GitLab and GitHub.
# Sourdough requires PHP ^8.3, so the test matrix starts at 8.3. A starter
# that can't pass its own tests is just flour and wishful thinking.
# Docker Hub images go through the GitLab Dependency Proxy to avoid the anonymous pull limit:
# from Preflight 0.3.0 each component pulls image_prefix/image, and image_prefix defaults to
# the group's proxy, so the image inputs below are plain image names. Put the prefix in the
# image as well and the dough is proofed twice: the pull fails.
include:
  - component: $CI_SERVER_FQDN/enterprise-apps/preflight/php-test@0.5.0
    inputs:
      php_versions: ["8.3", "8.4", "8.5"]
      image: "php:${PHP_VERSION}-cli-trixie"
  # No image input: from 0.5.0 composer-audit's default is composer 2.11.1, pinned by its list digest.
  - component: $CI_SERVER_FQDN/enterprise-apps/preflight/composer-audit@0.5.0
  # The front page deploy layer (ADR-0017): PROCTOR checks deploy/ against CREED's policy.
  # allow_failure: set while deploy/ had findings (unbounded dev-main constraints, CI files missing). Neither
  # shows up on PROCTOR 0.11: `proctor check` on deploy/ passes, with warnings only.
  - component: $CI_SERVER_FQDN/enterprise-apps/preflight/proctor@0.5.0
    inputs:
      working_dir: deploy
      proctor_command: vendor/bin/proctor check --format=codequality
      allow_failure: true
      image: "php:8.4-cli-trixie@sha256:9cf851bc2c1b37c3e59dfd677a3c3e56d485af5a47c93f629424bb039eafcb69"
  # Accessibility: Preflight's a11y component serves site/ and checks every page with axe-core 4.14.0, light and
  # dark, at 320 and 1280 px, plus WCAG 1.4.10 reflow, at WCAG 2.2 AA. Its Playwright image comes from
  # mcr.microsoft.com, which the Dependency Proxy does not front, so it takes no image_prefix.
  - component: $CI_SERVER_FQDN/enterprise-apps/preflight/a11y@0.5.0
    inputs:
      site_dir: site
      pages: ["**/*.html"]
      wcag_tags: ["wcag2a", "wcag2aa", "wcag21a", "wcag21aa", "wcag22aa"]

# WayneUI strict copies: PROCTOR runs on the project root so it sees site/assets/wayne-ui/.
# The setting extra.proctor."wayneui.copies" = "fail" in composer.json makes a stale copy fail.
# The jobs from here down are Sourdough's own, not Preflight components, so they name the proxy themselves.
wayneui-copies:
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/composer:2.11.1@sha256:8de2184c6de224f4689e8f80ed5f5edaf0030b6b8b7839a22a2bcb6722ac87d0
  script:
    - composer install --working-dir=deploy --no-interaction --no-progress --prefer-dist
    - deploy/vendor/bin/proctor check --path=.

composer-ci:
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/composer:2.11.1@sha256:8de2184c6de224f4689e8f80ed5f5edaf0030b6b8b7839a22a2bcb6722ac87d0
  script:
    - composer install --no-interaction --no-progress --prefer-dist
    - composer ci

# Smoke gate: bake each shape for real and run the generated app's own checks
# (see MAINTAINING.md, "Smoke gate"). A shape may only be claimed when its
# gate is green. The runner has no Docker daemon, so the script runs directly
# in a php image with Composer and Node 22 installed at job start.
# allow_failure: true until the lead has seen every shape green once; flip to false after.
.smoke-base:
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/php:8.5-cli-trixie
  allow_failure: true
  # Download Composer and Node once, check each sha256, and reuse them from the cache.
  cache:
    key: smoke-tools-composer-2.11.1-node-22.23.4
    paths: [.cache/smoke-tools/]
    when: always
  variables:
    SMOKE_REPO: $CI_PROJECT_DIR
  before_script:
    - apt-get update -qq && apt-get install -y --no-install-recommends ca-certificates curl git unzip xz-utils
    - |
      mkdir -p .cache/smoke-tools
      if [ ! -f .cache/smoke-tools/composer-2.11.1.phar ]; then
        curl -fsSL --retry 3 -o .cache/smoke-tools/composer-2.11.1.phar https://getcomposer.org/download/2.11.1/composer.phar
      fi
      if ! echo "6f1b891e1d4927d62740276c540fb490e47689e19e102c49e8da849794882f8c  .cache/smoke-tools/composer-2.11.1.phar" | sha256sum -c -; then
        rm -f .cache/smoke-tools/composer-2.11.1.phar
        exit 1
      fi
      install -m 0755 .cache/smoke-tools/composer-2.11.1.phar /usr/local/bin/composer
    - |
      arch="$(dpkg --print-architecture)"
      case "$arch" in
        amd64) node_arch=x64; node_sha256=1805bcd35e6815559bd2eb97db438d3fdb0eb3a5e6a977b7c1badca76337e9ce ;;
        arm64) node_arch=arm64; node_sha256=6287aa46b6c375d816e63ae66d024fbbfd70404825aabdfdf898a970871d2f4b ;;
        *) echo "Unsupported architecture: $arch" && exit 1 ;;
      esac
      mkdir -p .cache/smoke-tools
      if [ ! -f ".cache/smoke-tools/node-v22.23.4-linux-${node_arch}.tar.xz" ]; then
        curl -fsSL --retry 3 -o ".cache/smoke-tools/node-v22.23.4-linux-${node_arch}.tar.xz" "https://nodejs.org/dist/v22.23.4/node-v22.23.4-linux-${node_arch}.tar.xz"
      fi
      if ! echo "${node_sha256}  .cache/smoke-tools/node-v22.23.4-linux-${node_arch}.tar.xz" | sha256sum -c -; then
        rm -f ".cache/smoke-tools/node-v22.23.4-linux-${node_arch}.tar.xz"
        exit 1
      fi
      mkdir -p /opt/node
      tar -xJf ".cache/smoke-tools/node-v22.23.4-linux-${node_arch}.tar.xz" -C /opt/node --strip-components=1
      ln -sf /opt/node/bin/node /usr/local/bin/node
      ln -sf /opt/node/bin/npm /usr/local/bin/npm
      ln -sf /opt/node/bin/npx /usr/local/bin/npx

smoke-raw:
  extends: .smoke-base
  script:
    - sh scripts/smoke-shape.sh raw

smoke-raw-vue:
  extends: .smoke-base
  script:
    - sh scripts/smoke-shape.sh raw-vue

smoke-blade:
  extends: .smoke-base
  script:
    - sh scripts/smoke-shape.sh blade

smoke-blade-vue:
  extends: .smoke-base
  script:
    - sh scripts/smoke-shape.sh blade-vue

smoke-inertia:
  extends: .smoke-base
  script:
    - sh scripts/smoke-shape.sh inertia

# The proof: every shape and every Laravel shape in each oven, one after
# another, with the last release fed forward (scripts/proof.sh, see
# docs/reference/proof.md). A full proof takes its time, like any good dough,
# so it never runs on a push: start it by hand from any pipeline, or from a
# pipeline schedule that sets SOURDOUGH_PROOF to 1. The Last run table and
# every step log are kept as artifacts.
proof:
  extends: .smoke-base
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $SOURDOUGH_PROOF == "1"
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - when: manual
      allow_failure: true
  timeout: 2h
  variables:
    PROOF_OUT: $CI_PROJECT_DIR/proof-out
  script:
    - sh scripts/proof.sh --here
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - proof-out/
