# Sourdough's pipeline, built from the Preflight components on this GitLab.
# Pinned to released Preflight tags. Never use ~latest.
# composer ci is the contract: the same checks run on GitLab and GitHub.
# Sourdough requires PHP ^8.3, so the test matrix starts at 8.3. A starter
# that can't pass its own tests is just flour and wishful thinking.
# Docker Hub images go through the GitLab Dependency Proxy to avoid the anonymous pull limit.
include:
  - component: $CI_SERVER_FQDN/enterprise-apps/preflight/php-test@0.1.4
    inputs:
      php_versions: ["8.3", "8.4", "8.5"]
      image: "${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/php:${PHP_VERSION}-cli-trixie"
  - component: $CI_SERVER_FQDN/enterprise-apps/preflight/composer-audit@0.1.4
    inputs:
      image: "${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/composer:2@sha256:b6dcd72ca98fa19d0e5b8476de179859704891fad06dd9e0b96833d4c430a5fc"
  # The front page deploy layer (ADR-0017): PROCTOR checks deploy/ against CREED's policy.
  # allow_failure: current findings: unbounded dev-main constraints; CI files missing in deploy/.
  - component: $CI_SERVER_FQDN/enterprise-apps/preflight/proctor@0.1.4
    inputs:
      working_dir: deploy
      proctor_command: vendor/bin/proctor check --policy=vendor/waynestate/creed/policy/policy.json --format=codequality
      allow_failure: true
      image: "${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/php:8.4-cli-trixie@sha256:9cf851bc2c1b37c3e59dfd677a3c3e56d485af5a47c93f629424bb039eafcb69"

# WayneUI strict copies: PROCTOR runs on the project root so it sees site/assets/wayne-ui/.
# The setting extra.proctor."wayneui.copies" = "fail" in composer.json makes a stale copy fail.
wayneui-copies:
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/composer:2.10.3
  script:
    - composer install --working-dir=deploy --no-interaction --no-progress --prefer-dist
    - deploy/vendor/bin/proctor check --path=. --policy=deploy/vendor/waynestate/creed/policy/policy.json

composer-ci:
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/composer:2.10.3
  script:
    - composer install --no-interaction --no-progress --prefer-dist
    - composer ci

# Smoke gate: bake each shape for real and run the generated app's own checks
# (see MAINTAINING.md, "Smoke gate"). A shape may only be claimed when its
# gate is green. The runner has no Docker daemon, so the script runs directly
# in a php image with Composer and Node 22 installed at job start.
# allow_failure: true until the lead has seen every shape green once; flip to false after.
.smoke-base:
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/php:8.5-cli-trixie
  allow_failure: true
  variables:
    SMOKE_REPO: $CI_PROJECT_DIR
  before_script:
    - apt-get update -qq && apt-get install -y --no-install-recommends ca-certificates curl git xz-utils
    - curl -fsSL https://getcomposer.org/installer | php --install-dir=/usr/local/bin --filename=composer
    - |
      arch="$(dpkg --print-architecture)"
      case "$arch" in
        amd64) node_arch=x64 ;;
        arm64) node_arch=arm64 ;;
        *) echo "Unsupported architecture: $arch" && exit 1 ;;
      esac
      curl -fsSL "https://nodejs.org/dist/v22.23.4/node-v22.23.4-linux-${node_arch}.tar.xz" -o /tmp/node.tar.xz
      mkdir -p /opt/node
      tar -xJf /tmp/node.tar.xz -C /opt/node --strip-components=1
      ln -sf /opt/node/bin/node /usr/local/bin/node
      ln -sf /opt/node/bin/npm /usr/local/bin/npm
      ln -sf /opt/node/bin/npx /usr/local/bin/npx

smoke-raw:
  extends: .smoke-base
  script:
    - sh scripts/smoke-shape.sh raw

smoke-blade:
  extends: .smoke-base
  script:
    - sh scripts/smoke-shape.sh blade

smoke-blade-vue:
  extends: .smoke-base
  script:
    - sh scripts/smoke-shape.sh blade-vue

smoke-inertia:
  extends: .smoke-base
  script:
    - sh scripts/smoke-shape.sh inertia
