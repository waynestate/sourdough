; expose_php off: HELMET's default, so local matches what HELMET enforces.
expose_php = Off
; Strict sessions: HELMET's default, so local matches what HELMET enforces.
session.use_strict_mode = 1
; Sessions only via cookie: HELMET's default, so local matches what HELMET enforces.
session.use_only_cookies = 1
; HttpOnly session cookie: HELMET's default, so local matches what HELMET enforces.
session.cookie_httponly = 1
; SameSite=Lax session cookie: HELMET's default, so local matches what HELMET enforces.
session.cookie_samesite = Lax
; A predictable memory limit for local development.
memory_limit = 256M
; The stack's timezone, so timestamps match production.
date.timezone = America/Detroit
