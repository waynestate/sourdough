# Local development, generated by Sourdough. Works the same on Windows, macOS and
# Linux. Start it with `composer dev-up` or `docker compose up --build`.
# This is for local work; build the `prod` target of the Dockerfile for production.
# Ports are published on 127.0.0.1 only, so the dev server is not reachable from the network.
services:
    app:
        build:
            context: .
            target: dev
        ports:
            - '127.0.0.1:${APP_PORT:-8000}:8000'
        volumes:
            - '.:/app'
        env_file:
            - .env
        depends_on:
            mysql:
                condition: service_healthy
    mysql:
        image: 'mysql:8.4@sha256:a81d043930e51745522bd5c430961cf8286f0a23f0a9a2a6e0108f7ea71b0902'
        environment:
            MYSQL_ROOT_PASSWORD: '${DB_PASSWORD:-password}'
            MYSQL_DATABASE: '${DB_DATABASE:-laravel}'
            MYSQL_USER: '${DB_USERNAME:-app}'
            MYSQL_PASSWORD: '${DB_PASSWORD:-password}'
        volumes:
            - 'app-mysql:/var/lib/mysql'
        healthcheck:
            test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-p${DB_PASSWORD:-password}']
            retries: 5
            timeout: 5s
volumes:
    app-mysql:
