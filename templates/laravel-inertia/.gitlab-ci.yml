# {{app_name}}'s pipeline, built from the Preflight components on this GitLab.
# Pinned to Preflight 0.8.0. Never use ~latest.
# {{app_name}} requires PHP ^8.3, so the test matrix starts at 8.3.
# composer ci is the contract: every check runs from the "ci" script in composer.json.
# From Preflight 0.3.0 each component pulls image_prefix/image, with its own
# default image (pinned by digest in that release). image_prefix is this file's
# ${IMAGE_PREFIX}, so the components take the same proxy rule as the jobs
# further down. To override an image, give the plain name (php:8.4-cli-trixie@sha256:...):
# put the prefix in it too and the loaf gets proofed twice, and the pull fails.
include:
  - component: $CI_SERVER_FQDN/enterprise-apps/preflight/php-test@28d9c5994d06c633850d431dcf6ca56c48a96055 # 0.8.0
    inputs:
      php_versions: ["8.3", "8.4", "8.5"]
      # The example tests are Pest files, and PHPUnit refuses to load them
      # ("Please run ./vendor/bin/pest instead"). Pest runs PHPUnit classes too.
      test_command: vendor/bin/pest
      image_prefix: "${IMAGE_PREFIX}"
  - component: $CI_SERVER_FQDN/enterprise-apps/preflight/composer-audit@28d9c5994d06c633850d431dcf6ca56c48a96055 # 0.8.0
    inputs:
      image_prefix: "${IMAGE_PREFIX}"
  # The bill of materials (BEST_PRACTICES 4.15): a CycloneDX SBOM of the
  # Composer packages composer.lock installs, dev packages left out, kept as
  # sbom.cdx.json for 30 days. When the next advisory lands, finding the
  # apps it hits is one search per app instead of one guess per app.
  - component: $CI_SERVER_FQDN/enterprise-apps/preflight/sbom@28d9c5994d06c633850d431dcf6ca56c48a96055 # 0.8.0
    inputs:
      image_prefix: "${IMAGE_PREFIX}"
  # Gitleaks reads the checkout and fails on anything shaped like a
  # credential, with the finding redacted in the log and in gitleaks.json.
  # A secret belongs in Settings > CI/CD > Variables, never in a file.
  - component: $CI_SERVER_FQDN/enterprise-apps/preflight/secret-detection@28d9c5994d06c633850d431dcf6ca56c48a96055 # 0.8.0
    inputs:
      image_prefix: "${IMAGE_PREFIX}"
  # Migrations meet the MySQL 5.6.51 that Citadel shares (CREED databases.md,
  # a MUST). The tests run on SQLite, which takes a JSON column or a long
  # utf8mb4 index that 5.6 rejects at deploy. This job runs php artisan
  # migrate against a real 5.6.51 service instead. The official 5.6 images
  # are amd64 only, so the job carries the amd64 runner tag. Proof the dough
  # in the oven you will bake it in.
  - component: $CI_SERVER_FQDN/enterprise-apps/preflight/mysql56-migrate@28d9c5994d06c633850d431dcf6ca56c48a96055 # 0.8.0
    inputs:
      image_prefix: "${IMAGE_PREFIX}"
  # The accessibility gate (BEST_PRACTICES 6.4): axe-core in a real browser
  # over the pages the a11y-pages job saves, light and dark, at 320 and
  # 1280 px, plus WCAG 1.4.10 reflow. The tags are WCAG 2.2 AA, WayneUI's
  # floor; the ADA Title II rule names 2.1 AA, which 2.2 AA includes. The
  # pages list is the a11y-pages job's A11Y_PATHS: change the two together.
  # The Playwright image comes from mcr.microsoft.com, which the Dependency
  # Proxy does not front, so this component takes no image_prefix.
  - component: $CI_SERVER_FQDN/enterprise-apps/preflight/a11y@28d9c5994d06c633850d431dcf6ca56c48a96055 # 0.8.0
    inputs:
      site_dir: a11y-site
      pages: ["/", "/dashboard"]
      wcag_tags: ["wcag2a", "wcag2aa", "wcag21a", "wcag21aa", "wcag22aa"]

# Dependency caching. Docker Hub images come through the group's GitLab
# Dependency Proxy when this GitLab has one, so pipelines are served from
# GitLab's copy instead of counting against Docker Hub's pull limit; without
# the proxy they come straight from Docker Hub. To force Docker Hub (a group
# with the proxy turned off), set IMAGE_PREFIX to docker.io in Settings >
# CI/CD > Variables. Composer and npm downloads are cached under a fixed key.
workflow:
  rules:
    - if: $CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX
      variables:
        IMAGE_PREFIX: $CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX
    - when: always

variables:
  IMAGE_PREFIX: docker.io
  COMPOSER_CACHE_DIR: "$CI_PROJECT_DIR/.cache/composer"
  npm_config_cache: "$CI_PROJECT_DIR/.cache/npm"

# Every dependency download goes through a cache. The key is fixed, not a
# lock-file hash: Composer's and npm's caches are additive, so a lock change
# downloads only what changed instead of everything.
# The cache saves even when a job fails (when: always), so a dropped download
# still keeps every package that finished, and the retry fetches only the rest.
.composer-cache:
  cache:
    key: composer
    paths: [.cache/composer/]
    when: always

.npm-cache:
  cache:
    key: npm
    paths: [.cache/npm/]
    when: always

composer-ci:
  extends: .composer-cache
  image: ${IMAGE_PREFIX}/composer:2.11.1@sha256:8de2184c6de224f4689e8f80ed5f5edaf0030b6b8b7839a22a2bcb6722ac87d0
  script:
    - composer install --no-interaction --no-progress --prefer-dist
    - composer ci
  # Pinstripe's Pint findings in the merge request widget (Pinstripe README,
  # "Show Pint findings in the merge request"). after_script runs when
  # composer ci fails too, which is when the report matters; it writes []
  # when the code is clean, and skips quietly when the install never
  # finished. The flour on the counter shows up in the merge request.
  after_script:
    - test -x vendor/bin/pint && composer lint:gitlab || true
  artifacts:
    when: always
    expire_in: 7 days
    reports:
      codequality: pint-codequality.json

# PROCTOR measures {{app_name}} against the CREED version policy. Warnings are
# allowed; failures block the pipeline.
proctor-root:
  extends: .composer-cache
  image: ${IMAGE_PREFIX}/composer:2.11.1@sha256:8de2184c6de224f4689e8f80ed5f5edaf0030b6b8b7839a22a2bcb6722ac87d0
  script:
    - composer install --no-interaction --no-progress --prefer-dist
    - composer proctor

# The front end: WayneUI is the only component source. ESLint bans the
# Tailwind kit's components/ui imports and helper packages, Prettier and
# vue-tsc keep the code honest, and the build proves WayneUI's CSS and icon
# sprite still resolve. npm ci installs exactly what package-lock.json pins,
# with install scripts off (BEST_PRACTICES 4.10), and stops when the lock and
# package.json disagree: change a dependency with npm install and commit both
# files. A package that needs its install script gets an `npm rebuild <name>`
# line after npm ci. The gate runs `npm audit --audit-level=high --omit=dev`
# and fails the job on a high or critical advisory in a runtime dependency
# only; the second run prints everything and never fails. Multi-arch image,
# pinned by its list digest.
frontend:
  extends: .npm-cache
  image: ${IMAGE_PREFIX}/node:22.21.1-alpine3.22@sha256:b2358485e3e33bc3a33114d2b1bdb18cdbe4df01bd2b257198eb51beb1f026c5
  script:
    - npm ci --ignore-scripts --no-audit --no-fund
    - npm audit --audit-level=high
      --omit=dev
    - npm audit || true
    - npm run lint
    - npm run format:check
    - npm run typecheck
    - npm run build
    # The npm half of the bill of materials (BEST_PRACTICES 4.15): every
    # package the install put in node_modules, dev ones too (the build tools
    # make the bundle), as a CycloneDX SBOM from the CycloneDX project's own
    # tool, pinned, with no install scripts. Kept 30 days with the build.
    - npm exec --yes --ignore-scripts --package=@cyclonedx/cyclonedx-npm@6.0.1 -- cyclonedx-npm --output-format JSON --output-reproducible --validate --output-file sbom-npm.cdx.json
  artifacts:
    expire_in: 30 days
    paths:
      - public/build/
      - sbom-npm.cdx.json

# ZIGGY's route list ships inside the Vite bundle, not an inline script, so
# the committed resources/js/ziggy.* must match the routes. Regenerate and
# fail on any diff.
ziggy:
  extends: .composer-cache
  image: ${IMAGE_PREFIX}/composer:2.11.1@sha256:8de2184c6de224f4689e8f80ed5f5edaf0030b6b8b7839a22a2bcb6722ac87d0
  script:
    - composer install --no-interaction --no-progress --prefer-dist
    - composer ziggy
    - git diff --exit-code resources/js/ziggy.*

# Is the loaf still fed? This job installs the newest Sourdough release and
# asks it about this app, so the app cannot drift from its template unseen.
# sourdough manifest --check lists the managed files changed since the last
# bake or feed. That list is a report, never a failure: Sourdough's docs call
# drift normal (sourdough feed merges your edits with the template's), and a
# file you customized stays on it after every feed. sourdough feed --dry-run
# exits 1 when a newer release has template changes this app has not fed:
# the job exits 1 and allow_failure turns that into a warning, so a pending
# feed never blocks a deploy. Run sourdough feed, review and commit to clear
# it. Exit 2 from either command (no manifest, a manifest from a newer
# Sourdough, conflicts left over from the last feed, a failed bake) fails the
# job: the app's record needs fixing first. .cache/ is this pipeline's
# download cache, so git ignores it and the dry run sees a clean tree.
# https://sourdough.apps.wayne.edu/docs/guides/keeping-current.html#feed-in-ci
sourdough-feed:
  extends: .composer-cache
  image: ${IMAGE_PREFIX}/composer:2.11.1@sha256:8de2184c6de224f4689e8f80ed5f5edaf0030b6b8b7839a22a2bcb6722ac87d0
  variables:
    SOURDOUGH_HOME: /tmp/sourdough
  allow_failure:
    exit_codes: [1]
  script:
    - composer create-project --no-dev --no-interaction --no-progress --prefer-dist waynestate/sourdough "$SOURDOUGH_HOME"
    - mkdir -p .git/info && echo .cache/ >> .git/info/exclude
    - drift=0; php "$SOURDOUGH_HOME/bin/sourdough" manifest --check || drift=$?
    - fed=0; php "$SOURDOUGH_HOME/bin/sourdough" feed --dry-run || fed=$?
    - if [ "$drift" -gt 1 ] || [ "$fed" -gt 1 ]; then exit 2; fi
    - if [ "$fed" -eq 1 ]; then echo "This app has template changes to feed. Run sourdough feed, review and commit." >&2; exit 1; fi

# The pages the a11y gate checks. axe-core needs a page in a browser, so
# this job boots the app as its first run on your desk does (.env from
# .env.example, a key, an SQLite database, php artisan serve), where SESAME
# signs in with its fake driver, and saves each path in A11Y_PATHS, with
# public/'s static files, into a11y-site/ for the a11y job. / is the home
# page signed out; /dashboard goes through /login and comes back signed
# in, the part of the sign-in flow this app draws (in production the CAS
# server draws its own sign-in page). Add each page you build to
# A11Y_PATHS and to the a11y include's pages. The gate finds only part of
# the problems: try each page with a keyboard and a screen reader too.
# The frontend job's build comes along in public/build/, so the Vue code
# runs in the checked page as it does for a person.
a11y-pages:
  extends: .composer-cache
  image: ${IMAGE_PREFIX}/composer:2.11.1@sha256:8de2184c6de224f4689e8f80ed5f5edaf0030b6b8b7839a22a2bcb6722ac87d0
  needs: [frontend]
  variables:
    A11Y_PATHS: "/ /dashboard"
  script:
    - composer install --no-interaction --no-progress --prefer-dist
    - cp .env.example .env
    - php artisan key:generate --no-interaction
    - touch database/database.sqlite
    - php artisan migrate --force --no-interaction
    - php artisan serve --host=127.0.0.1 --port=8080 --no-reload > a11y-server.log 2>&1 &
    # Wait for /up, copy public/'s static files (never its PHP), then save
    # each page in A11Y_PATHS as <path>/index.html and each JSON answer in
    # A11Y_DATA at its own path. One cookie jar for the whole list keeps the
    # fake sign-in from one path to the next, and the server's own origin
    # is cut out of the saved pages so their links work on any port.
    - |
      set -eu
      origin=http://127.0.0.1:8080
      tries=0
      until curl -sf -o /dev/null "$origin/up"; do
        tries=$((tries + 1))
        if [ "$tries" -ge 30 ]; then echo "The app did not answer $origin/up within 30s." >&2; cat a11y-server.log >&2; exit 1; fi
        sleep 1
      done
      rm -rf a11y-site
      mkdir a11y-site
      cp -R public/. a11y-site/
      find a11y-site -name '*.php' -delete
      for path in $A11Y_PATHS; do
        page="a11y-site${path%/}/index.html"
        mkdir -p "$(dirname "$page")"
        curl -fsSL -b .a11y-cookies -c .a11y-cookies -o "$page" "$origin$path"
        sed -i -e "s#$origin/#/#g" -e "s#$origin#/#g" "$page"
        echo "a11y-pages: saved $path"
      done
      for path in ${A11Y_DATA:-}; do
        mkdir -p "$(dirname "a11y-site$path")"
        curl -fsSL -b .a11y-cookies -c .a11y-cookies -H 'Accept: application/json' -o "a11y-site$path" "$origin$path"
        echo "a11y-pages: saved $path"
      done
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - a11y-site/
      - a11y-server.log

a11y:
  needs: [a11y-pages]

# Deploy credentials (BEST_PRACTICES 6.5). Citadel deploys this app with a
# Quick Update, so the pipeline holds no deploy credential and runs no
# deploy job. When you add one (a webhook, a Squire target, a rollout on
# another platform), extend .deploy:
#
#   deploy-production:
#     extends: .deploy
#     script:
#       - ./deploy.sh
#
# .deploy never runs in a merge request pipeline (that code is not merged
# yet) and runs only on a protected branch or tag, the only refs where
# GitLab hands a job its protected variables. Keep the credential in a
# protected, masked variable in Settings > CI/CD > Variables, never in this
# file or in a component's inputs. The README's "Pipeline" section lists
# the project settings this file cannot hold. A loaf this well guarded
# needs no bouncer at the bakery door.
.deploy:
  stage: deploy
  resource_group: deploy
  interruptible: false
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - if: $CI_COMMIT_REF_PROTECTED == "true"
