# PREFLIGHT components, pinned to the Preflight 0.3.0 release commit. Never use
# ~latest. From 0.3.0 each component pulls image_prefix/image, with its own
# default image (pinned by digest in that release). image_prefix is this file's
# ${IMAGE_PREFIX}, so the components take the same proxy rule as the jobs
# further down. To override an image, give the plain name (php:8.4-cli-trixie@sha256:...):
# put the prefix in it too and the loaf gets proofed twice, and the pull fails.
include:
  - component: $CI_SERVER_FQDN/enterprise-apps/preflight/proctor@23038dfe767f6ef60e3b2efca1128f53d9acdff7 # 0.3.0
    inputs:
      proctor_command: vendor/bin/proctor check --format=codequality
      image_prefix: "${IMAGE_PREFIX}"
  - component: $CI_SERVER_FQDN/enterprise-apps/preflight/php-test@23038dfe767f6ef60e3b2efca1128f53d9acdff7 # 0.3.0
    inputs:
      php_versions: ["8.3", "8.4", "8.5"]
      test_command: vendor/bin/phpunit
      image_prefix: "${IMAGE_PREFIX}"
  - component: $CI_SERVER_FQDN/enterprise-apps/preflight/composer-audit@23038dfe767f6ef60e3b2efca1128f53d9acdff7 # 0.3.0
    inputs:
      working_dir: .
      image_prefix: "${IMAGE_PREFIX}"

# Dependency caching. Docker Hub images come through the group's GitLab
# Dependency Proxy when this GitLab has one, so pipelines are served from
# GitLab's copy instead of counting against Docker Hub's pull limit; without
# the proxy they come straight from Docker Hub. To force Docker Hub (a group
# with the proxy turned off), set IMAGE_PREFIX to docker.io in Settings >
# CI/CD > Variables. Composer and npm downloads are cached per lock file.
workflow:
  rules:
    - if: $CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX
      variables:
        IMAGE_PREFIX: $CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX
    - when: always

variables:
  IMAGE_PREFIX: docker.io
  COMPOSER_CACHE_DIR: "$CI_PROJECT_DIR/.cache/composer"
  npm_config_cache: "$CI_PROJECT_DIR/.cache/npm"

.composer-cache:
  cache:
    key:
      files: [composer.lock]
      prefix: composer
    paths: [.cache/composer/]

# package.json is in the key too, so the cache still turns over before
# package-lock.json is committed.
.npm-cache:
  cache:
    key:
      files: [package-lock.json, package.json]
      prefix: npm
    paths: [.cache/npm/]

# composer ci is the contract: one job runs the whole "ci" script from
# composer.json, so PROCTOR sees an explicit composer ci in the pipeline.
composer-ci:
  extends: .composer-cache
  image: ${IMAGE_PREFIX}/composer:2.10.3
  script:
    - composer install --no-interaction --no-progress --prefer-dist
    - composer ci

# The front end: the build proves the Vue app, WayneUI's CSS and its icon
# sprite still resolve. Commit package-lock.json and switch to npm ci for
# repeatable installs. Multi-arch image, pinned by its list digest.
frontend:
  extends: .npm-cache
  image: ${IMAGE_PREFIX}/node:22.21.1-alpine3.22@sha256:b2358485e3e33bc3a33114d2b1bdb18cdbe4df01bd2b257198eb51beb1f026c5
  script:
    - npm install --no-audit --no-fund
    - npm run build
